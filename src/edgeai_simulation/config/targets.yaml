# DEVELOPMENT-ONLY arena truth. Do not feed these poses to autonomous perception.
# world pose: [x, y, z, roll, pitch, yaw], metres/radians.
# Target frame: +X points out of the printed front, +Y is image-right when
# viewed from the front, +Z is up. Marker centre = target origin.
# OpenCV marker frame: x=target +Y, y=target +Z, z=target +X.
dictionary: DICT_4X4_50
marker_size_m: 0.20  # outer BLACK square; white quiet margin is additional
panel_size_m: 0.24
development_rescue_geometry:
  normal_offset_m: 0.70
  cooperative_lateral_offset_m: 0.40
  radius_m: 0.18
  normal_dwell_s: 3.0
  cooperative_dwell_s: 5.0
targets:
  - id: 1
    name: T1
    type: normal
    pose: [-2.42, -1.5, 0.24, 0.0, 0.0, 0.0]
  - id: 2
    name: T2
    type: normal
    pose: [-2.42, -0.6, 0.24, 0.0, 0.0, 0.0]
  - id: 3
    name: T3
    type: normal
    pose: [2.42, 1.6, 0.24, 0.0, 0.0, 3.141592653589793]
  - id: 10
    name: TC1
    type: cooperative
    pose: [-0.3, 2.42, 0.24, 0.0, 0.0, -1.5707963267948966]
