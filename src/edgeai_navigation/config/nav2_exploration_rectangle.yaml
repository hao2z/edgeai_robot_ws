# Axle-centred rectangle: front .1125 m, rear .3125 m, width .33 m; padding .01 m.
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
controller_server:
  ros__parameters:
    # 控制器计算频率，Hz；不是全局路径重规划频率。
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 控制计算连续失败的容忍时间，秒；超时可使 FollowPath 失败。
    failure_tolerance: 0.6
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # 进展判定所需平移距离，米；原地旋转不计为平移进展。
      required_movement_radius: 0.1
      # 无足够平移进展的等待时间，仿真秒；超时触发失败并进入恢复。
      # ROS 参数类型为 double：整秒也需写成 7.0，不能写 7。
      movement_time_allowance: 7.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      # 到达位置容差，米；过大会提前成功，前沿可能仍未被观测。
      xy_goal_tolerance: 0.1
      # 到达朝向容差，弧度。
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      # DWB 倒车速度下限，m/s；负数允许倒车，须与速度平滑器匹配。
      min_vel_x: -0.3
      min_vel_y: 0.0
      # DWB 前进速度上限，m/s；同时受 max_speed_xy 和平滑器限制。
      max_vel_x: 0.6
      max_vel_y: 0.0
      # DWB 角速度幅值上限，rad/s；最终受平滑器正反向边界限制。
      max_vel_theta: 0.9
      min_speed_xy: 0.0
      max_speed_xy: 0.6
      min_speed_theta: 0.0
      # 线加速度上限，m/s²；速度平滑器还有独立限制。
      acc_lim_x: 0.4
      acc_lim_y: 0.0
      # 角加速度上限，rad/s²。
      acc_lim_theta: 0.8
      decel_lim_x: -0.4
      decel_lim_y: 0.0
      decel_lim_theta: -0.8
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      # DWB 候选轨迹预测时长，秒；更长能看得更远，但增加计算和碰撞约束。
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      # 到达位置容差，米；过大会提前成功，前沿可能仍未被观测。
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      # 路径朝向/前视点对齐代价权重；增大更偏向沿全局路径行驶。
      PathAlign.scale: 20.0
      # 目标对齐代价权重；不是路径跟随权重。
      GoalAlign.scale: 20.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.forward_point_distance: 0.1
      # 偏离全局路径的距离代价权重；增大减少抄近路，也可能限制绕障。
      PathDist.scale: 20.0
      # 接近目标的距离代价权重；与路径和障碍代价共同竞争。
      GoalDist.scale: 20.0
      # 接近终点后的旋转代价权重；不控制恢复旋转速度。
      RotateToGoal.scale: 40.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      # 合法轨迹的障碍代价权重；硬碰撞仍会直接淘汰，不能靠减小权重放行。
      ObstacleFootprint.scale: 0.05
      primary_controller: dwb_core::DWBLocalPlanner
      # Rotation Shim 接管转向的路径航向误差阈值，弧度。
      angular_dist_threshold: 0.5
      # Rotation Shim 退出转向的误差阈值，弧度。
      angular_disengage_threshold: 0.25
      forward_sampling_distance: 0.35
      # Rotation Shim 原地对齐路径的角速度，rad/s；不是 Spin 恢复速度。
      rotate_to_heading_angular_vel: 0.7
      max_angular_accel: 0.8
      simulate_ahead_time: 1.5
      rotate_to_heading_once: true
      rotate_to_goal_heading: false
      use_path_orientations: false
      closed_loop: true
    enable_stamped_cmd_vel: false
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 膨胀代价的距离衰减系数；增大则衰减更快、高代价带更窄。
        cost_scaling_factor: 5.0
        # 障碍膨胀范围，米；普通高代价区可通行，致命/内切区仍不可通行。
        inflation_radius: 0.38
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
      use_sim_time: true
      transform_tolerance: 0.2
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      footprint: '[[0.1125, 0.165], [-0.3125, 0.165], [-0.3125, -0.165], [0.1125,
        -0.165]]'
      # 车身轮廓外扩边距，米；局部与全局分别配置。
      footprint_padding: 0.005
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 膨胀代价的距离衰减系数；增大则衰减更快、高代价带更窄。
        cost_scaling_factor: 3.0
        # 障碍膨胀范围，米；普通高代价区可通行，致命/内切区仍不可通行。
        inflation_radius: 0.38
      always_send_full_costmap: true
      use_sim_time: true
      transform_tolerance: 0.2
      footprint: '[[0.1125, 0.165], [-0.3125, 0.165], [-0.3125, -0.165], [0.1125,
        -0.165]]'
      # 车身轮廓外扩边距，米；局部与全局分别配置。
      footprint_padding: 0.01
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    # 规划性能预期频率，Hz；实际周期在行为树 RateController.hz。
    expected_planner_frequency: 10.0
    planner_plugins:
    - GridBased
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      # NavFn 终点搜索容差，米；过大可能在前沿较远处结束路径，导致重复访问。
      tolerance: 0.1
      allow_unknown: true
      use_astar: false
      use_final_approach_orientation: true
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Spin 恢复角速度上限，rad/s；仍受速度平滑器限制。
    max_rotational_vel: 0.9
    # Spin 恢复最小角速度幅值，rad/s。
    min_rotational_vel: 0.3
    # Spin 恢复角加速度上限，rad/s²。
    rotational_acc_lim: 0.8
    enable_stamped_cmd_vel: false
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations:
    - AdjustSpeedLimit
    - ReroutingService
    - CollisionMonitor
    ReroutingService:
      plugin: nav2_route::ReroutingService
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      plugin: nav2_route::CollisionMonitor
      max_collision_dist: 3.0
    edge_cost_functions:
    - DistanceScorer
    - CostmapScorer
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    CostmapScorer:
      plugin: nav2_route::CostmapScorer
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # 最终速度上界，顺序 [vx(m/s), vy(m/s), wz(rad/s)]；导航和恢复均受限。
    max_velocity:
    - 0.6
    - 0.0
    - 0.9
    # 最终速度下界，顺序 [vx, vy, wz]；负号表示倒车/反向旋转，幅值可与正向不同。
    min_velocity:
    - -0.3
    - 0.0
    - -0.9
    # 最终加速度上界，顺序 [ax, ay, az]，单位 m/s²、m/s²、rad/s²。
    max_accel:
    - 0.4
    - 0.0
    - 0.8
    # 最终加速度下界，顺序 [ax, ay, az]；通常为负数。
    max_decel:
    - -0.4
    - 0.0
    - -0.8
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      # 碰撞监视器 approach 的预测时间，秒；更大通常更早减速。
      time_before_collision: 1.2
      simulation_time_step: 0.1
      # 触发此碰撞区域所需的最少传感器点数。
      min_points: 1
      visualize: false
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: scan
      min_height: -0.1
      max_height: 0.5
      enabled: true
    enable_stamped_cmd_vel: false
docking_server:
  ros__parameters:
    # 控制器计算频率，Hz；不是全局路径重规划频率。
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins:
    - simple_charging_dock
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
loopback_simulator:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    map_frame_id: map
    scan_frame_id: base_scan
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
