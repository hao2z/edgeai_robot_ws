# 公共导航配置；控制器参数分别见dwb/rpp/mppi_controller.yaml。
# Axle-centred rectangle: front .1125 m, rear .3125 m, width .33 m; padding .01 m.
# 矩形差速车探索配置；x向前、y向左，速度/距离/角度分别使用m/s、m、rad。
# 启动脚本据此生成 nav2-runtime.yaml，派生普通/朝向/救援控制器、检查器和规划器。
# 修改本文件供下次启动使用；实际运行参数以该次 nav2-runtime.yaml 为准。
# 调参入口：跟踪/前视→rpp_controller.yaml；路线/倒车→smac_lattice.yaml。
# 本文件优先看：①local/global膨胀 ②实际局部窗口 ③进展与到点判定 ④速度平滑限幅。
# 全局路径复用、刷新周期、短距恢复候选→behavior_trees/explore_recovery.xml。
# AMCL静态地图定位参数；当前自主探索由SLAM提供定位，本块不调节SLAM。
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
# 行为树导航器；运行时行为树和逐点到达规则由启动脚本/仲裁器设置。
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
# 局部路径跟踪：控制器由启动选项加载；这里只调公共到点和进展判定。
controller_server:
  ros__parameters:
    # 控制器计算频率，Hz；不是全局路径重规划频率。
    controller_frequency: 20.0
    # 等待代价地图完成更新的超时，s；增大允许更长等待，并不会提高地图更新频率。
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 控制计算连续失败的容忍时间，秒；超时可使 FollowPath 失败。
    failure_tolerance: 1.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      # ── 按需调整：停滞多久进入恢复；放宽只能延迟失败，不能改善跟踪 ──
      plugin: nav2_controller::SimpleProgressChecker
      # 进展判定所需平移距离，米；原地旋转不计为平移进展。
      required_movement_radius: 0.1
      # 无足够平移进展的等待时间，仿真秒；超时触发失败并进入恢复。
      movement_time_allowance: 8.0
    general_goal_checker:
      # ── 优先调整：普通点只检查位置；朝向/救援检查器由启动脚本单独派生 ──
      stateful: true
      plugin: nav2_controller::PositionGoalChecker
      # 到达位置容差，米；过大会提前成功，前沿可能仍未被观测。
      xy_goal_tolerance: 0.1
    enable_stamped_cmd_vel: false
# 局部避障地图；激光+膨胀；depth_obstacles.yaml开关控制额外深度层。
local_costmap:
  local_costmap:
    ros__parameters:
      # 代价地图内部更新频率，Hz；提高会增加传感器融合/栅格更新开销。
      update_frequency: 20.0
      # 代价地图对外发布频率，Hz；主要影响可视化/订阅者，不等于内部更新频率。
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # 原生初始尺寸必须为整数；实际窗口在下方width_m/height_m设置。
      width: 3
      height: 3
      # 栅格边长，m；减半会使相同面积的格子数约增至4倍。
      resolution: 0.05
      plugins:
      - fractional_window
      - obstacle_layer
      - inflation_layer
      # 实际窗口由此层width_m/height_m覆盖；支持小数米，修改后需重启。
      fractional_window:
        # ── 优先调整：实际局部窗口，m；过小缩短感知/预测范围，不宜继续盲目减小 ──
        plugin: edgeai_navigation::FractionalWindowLayer
        width_m: 3.0
        height_m: 3.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # ── 优先调整：局部障碍软代价；不会缩小矩形车身的硬碰撞边界 ──
        # 衰减系数(1/m)：越大衰减越快；半径(m)：软代价向外扩展距离。
        cost_scaling_factor: 10.0
        inflation_radius: 0.4
      # 保留的静态层配置；局部 plugins 未包含它，当前不启用。
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
      use_sim_time: true
      transform_tolerance: 0.2
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      footprint: '[[0.1125, 0.165], [-0.3125, 0.165], [-0.3125, -0.165], [0.1125,
        -0.165]]'
      # 车身四边额外净空，m；减小会降低安全余量，勿用来掩盖跟踪问题。
      footprint_padding: 0.005
# 全局地图：静态地图 + 原始激光动态障碍，最后统一膨胀。
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      # 最大代价合并：激光清除只影响本层，不擦除静态墙体；保留原始/scan以感知另一台车。
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # ── 优先调整：全局路线离墙偏好，配合smac_lattice.yaml的cost_penalty ──
        # 系数越小，离墙较远处仍有明显代价；半径须覆盖期望的离墙范围。
        cost_scaling_factor: 2.0
        inflation_radius: 0.4
      always_send_full_costmap: true
      use_sim_time: true
      transform_tolerance: 0.2
      footprint: '[[0.1125, 0.165], [-0.3125, 0.165], [-0.3125, -0.165], [0.1125,
        -0.165]]'
      footprint_padding: 0.01
# Lattice启动时全局padding至少0.02m，给跟踪留下比局部多1cm的余量。
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    # 以下GridBased是NavFn对照配置；默认Lattice启动时整体由smac_lattice.yaml覆盖。
    # 规划性能预期频率，Hz；实际周期在行为树 RateController.hz。
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
    # 等待代价地图完成更新的超时，s；增大允许更长等待，并不会提高地图更新频率。
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      # NavFn 终点搜索容差，米；过大可能在前沿较远处结束路径，导致重复访问。
      tolerance: 0.1
      # 允许全局路径穿过未知栅格；仍受障碍代价和局部传感器碰撞检查约束。
      allow_unknown: true
      use_astar: false
      # true按路径末段方向设置终点yaw；逐点朝向/救援入口使用另一个设为false的规划器。
      use_final_approach_orientation: true
# 路径平滑服务；当前探索行为树未调用 SmoothPath，不会自动平滑每次规划。
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
# Spin/BackUp等原生动作；恢复、主动观察可共用这些动作参数。
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - escape_occupied
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    # 仅边距占据时尝试低速退出；实际轮廓和padding由启动脚本从局部地图几何派生。
    escape_occupied:
      plugin: edgeai_navigation::OccupiedEscape
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    # TF变换查询/时效容忍量，s；不是对所有传感器数据统一放宽年龄限制。
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Spin 恢复角速度上限，rad/s；仍受速度平滑器限制。
    max_rotational_vel: 0.9
    # Spin 恢复最小角速度幅值，rad/s。
    min_rotational_vel: 0.3
    # Spin 恢复角加速度上限，rad/s²。
    rotational_acc_lim: 0.8
    enable_stamped_cmd_vel: false
# FollowWaypoints专用设置；当前单点导航/目标搜寻不通过此航点跟随器。
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
# 路线图导航参数；当前单点探索未使用路线图服务器。
route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations:
    - AdjustSpeedLimit
    - ReroutingService
    - CollisionMonitor
    ReroutingService:
      plugin: nav2_route::ReroutingService
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      plugin: nav2_route::CollisionMonitor
      max_collision_dist: 3.0
    edge_cost_functions:
    - DistanceScorer
    - CostmapScorer
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    CostmapScorer:
      plugin: nav2_route::CostmapScorer
# 速度平滑和限幅；位于局部控制器/动作输出与碰撞监视器之间。
velocity_smoother:
  ros__parameters:
    # ── 优先调整：最终速度/加速度边界；同时约束导航、倒车、恢复 ──
    # RPP巡航速度和转弯角速度应匹配这些边界；独立限幅可能改变曲率。
    # 速度插值/限幅频率，Hz；高于控制器频率时可插入中间速度。
    smoothing_frequency: 20.0
    # RPP启动时自动设true以协调各轴加减速；绝对速度匹配由预测前的MatchedRPP负责。
    scale_velocities: false
    # OPEN_LOOP使用上次输出速度作为状态，CLOSED_LOOP使用里程计反馈。
    feedback: OPEN_LOOP
    # 最终速度上界，顺序 [vx(m/s), vy(m/s), wz(rad/s)]；导航和恢复均受限。
    max_velocity:
    - 0.4
    - 0.0
    - 0.9
    # 最终速度下界，顺序 [vx, vy, wz]；负号表示倒车/反向旋转，幅值可与正向不同。
    min_velocity:
    - -0.2
    - 0.0
    - -0.9
    # 最终加速度上界，顺序 [ax, ay, az]，单位 m/s²、m/s²、rad/s²。
    max_accel:
    - 0.4
    - 0.0
    - 0.8
    # 最终加速度下界，顺序 [ax, ay, az]；通常为负数。
    max_decel:
    - -0.4
    - 0.0
    - -0.8
    odom_topic: odom
    odom_duration: 0.1
    # 各轴输出死区，顺序[vx,vy,wz]；低于阈值置零，过大可能吞掉精细接近指令。
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    # 多久未收到新速度指令后输出停车，s；不是导航总超时。
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
# 最终速度链的碰撞监视；可能在局部控制器正常输出时继续减速或停车。
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    # TF变换查询/时效容忍量，s；不是对所有传感器数据统一放宽年龄限制。
    transform_tolerance: 0.2
    # 传感器源数据过期阈值，s；源超时可触发停车，不是允许盲走的时间。
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      # 碰撞监视器 approach 的预测时间，秒；更大通常更早减速。
      time_before_collision: 0.3
      simulation_time_step: 0.1
      # 触发此碰撞区域所需的最少传感器点数。
      min_points: 1
      visualize: false
      enabled: true
    # 本层传感器输入 ID 列表；每个 ID 在下方有独立配置。
    observation_sources:
    - scan
    scan:
      type: scan
      topic: scan
      min_height: -0.1
      max_height: 0.5
      enabled: true
    enable_stamped_cmd_vel: false
# 充电靠桩参数；当前没有配置充电桩任务，不控制救援目标接近。
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins:
    - simple_charging_dock
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
# Nav2轻量运动/激光模拟器（Loopback）的保留配置；当前Gazebo场景不使用，不是SLAM回环检测。
loopback_simulator:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    map_frame_id: map
    scan_frame_id: base_scan
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
