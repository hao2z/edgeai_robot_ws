# 第一台保持现有接口，第二台使用robot2命名空间；初值是估计，不读取Gazebo真值。
target_id: 2
initial_relative_pose: [0.0, -0.60, 0.0]  # robot2相对robot1初始车体坐标：x向前，y向左，yaw(rad)
initial_std_xy_m: 0.20
initial_std_yaw_rad: 0.25
localization_timeout_s: 90.0  # 墙钟；无有效定位时不派发救援导航
localization_stable_s: 2.0  # 仿真秒
max_std_xy_m: 0.15
max_std_yaw_rad: 0.20
scan_match_distance_m: 0.18
min_scan_match_ratio: 0.55
max_data_age_s: 0.5
navigation_timeout_s: 180.0  # 每次导航的墙钟预算
navigation_retries: 2
preplan_recovery:  # 预规划起点占据时由C1任务树调用；成功后必须重新验路。
  enabled: true
  speed_mps: 0.03
  time_allowance_s: 8.0  # 单个Nav2行为的仿真秒上限。
  action_timeout_s: 24.0  # 墙钟；避免低仿真倍率提前取消动作。
  min_progress_m: 0.01
  min_progress_rad: 0.05
  motions:  # 全任务内按车保留尝试历史；每个候选最多一次，服务器检查碰撞。
    - {kind: spin, angle_rad: 0.35}
    - {kind: spin, angle_rad: -0.35}
    - {kind: backup, distance_m: -0.05}
    - {kind: forward, distance_m: 0.05}
    - {kind: escape, distance_m: -0.05}
    - {kind: escape, distance_m: 0.05}
rescue_repair_rounds: 3  # 导航成功但救援距离或朝向不达标：重新停车的重试上限
radius_m: 0.70
dwell_s: 10.0  # 两机同时满足距离、朝向和停车条件的连续仿真时间
settle_margin_s: 1.0  # 额外连续停车时间，避开真值离散采样覆盖到停稳前的窗口。
yaw_tolerance_rad: 0.25  # 按机器人到目标坐标的连线检查朝向；无需再次视觉发现。
alignment_enabled: true
alignment_step_m: 0.03  # 到位后一次小步前进上限；每步重新检查两机。
alignment_speed_mps: 0.03
alignment_timeout_s: 60.0
alignment_max_actions: 40  # 两机合计；耗尽交回任务树重选停车点。
parking_radii_m: [0.50, 0.55, 0.60]  # 两停车点距目标的候选距离；仍受radius_m-position_margin_m约束
position_margin_m: 0.15  # 停车点距圆边界的余量；覆盖0.10m导航容差并保留净余量
min_separation_m: 0.4  # 两停车点间的最小距离；还需通过完整车身分离检查
parked_peer_clearance_m: 0.02  # 进场路径上的车身与对方停车车身之间的净空
peer_costmap:
  enabled: true  # C1定位就绪后，在双方全局和局部代价地图标记对方车身
  # 车身padding从导航全局footprint_padding派生，不在此重复配置。
  max_age_s: 0.5  # 位姿过期后撤下车身标记，雷达障碍层照常工作
wall_timeout_s: 600.0  # S1成功后的总墙钟预算
