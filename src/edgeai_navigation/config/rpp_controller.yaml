# 调参顺序：先看【优先调整】，再按具体现象看【按需调整】；其余通常保持默认。
# 修改后重启；实际参数见会话nav2-runtime.yaml。地图、车身和速度平滑器沿用所选导航配置。
FollowPath:

  # ── 优先调整：路径跟踪最关键的三个参数 ──
  # ① 固定前视距离，m：仅在下方use_velocity_scaled_lookahead_dist=false时生效。
  # 减小更贴合急弯但可能抖动；增大更平顺但可能切弯。自适应开启时调下方min/max/time。
  lookahead_dist: 0.6
  # ② 巡航速度，m/s：先验证路线，再逐步提速；仍受转弯减速和底盘限幅。
  desired_linear_vel: 0.4
  # ③ 曲率减速半径阈值，m：实际转弯半径小于它时减速；增大可让更多弯道慢行。
  regulated_linear_scaling_min_radius: 0.6

  # ── 按需调整：U弯跳段、原地转向、末段慢行 ──
  # U弯跳到另一侧路径时检查此项：沿路径搜索最近点的范围，m；不是前视距离。
  max_robot_pose_search_dist: 0.6
  # 原地转向太频繁时检查此项：航向误差触发阈值，rad；0.785约45°，增大减少触发。
  angular_dist_threshold: 0.785
  # 终点前爬行过长时检查这两项：减速距离(m)、最低接近速度(m/s)；提速过多可能过冲。
  approach_velocity_scaling_dist: 0.4
  min_approach_linear_velocity: 0.05
  # 倒车偏好上限(m/s)：启动时与公共min_velocity取较小值，在RPP碰撞预测前生效。
  reverse_velocity_limit: 0.2

  # ── 支撑配置：通常不动；不通过关闭碰撞检查解决停滞 ──
  plugin: nav2_rotation_shim_controller::RotationShimController
  # 原生Shim处理起步/终点转向，RPP只跟踪路径。
  primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
  angular_disengage_threshold: 0.25
  forward_sampling_distance: 0.3
  # 对齐速度(rad/s)及角加速度(rad/s²)；启动时自动不超过公共速度平滑器对应边界。
  rotate_to_heading_angular_vel: 0.9
  max_angular_accel: 0.8
  simulate_ahead_time: 1.5
  # 重规划后复查路径航向，避免单次TF缺口导致整个目标跳过对齐。
  rotate_to_heading_once: false
  # 带朝向/救援任务生效；普通位置点运行时关闭，保持不要求最终朝向。
  rotate_to_goal_heading: true
  # 使用Lattice车身朝向；启动时将局部地图帧联动到map，保证Jazzy原生Shim比较同一帧的yaw。
  use_path_orientations: true
  closed_loop: true
  transform_tolerance: 0.3
  use_collision_detection: true
  # 碰撞预测时间上限，s；减小会缩短预警时间，范围还受前视点限制。
  max_allowed_time_to_collision_up_to_carrot: 0.3
  use_regulated_linear_velocity_scaling: true
  regulated_linear_scaling_min_speed: 0.05
  # Shim统一处理转向，避免RPP重复处理最终朝向。
  use_rotate_to_heading: false
  # 公共默认；各用途的倒车许可在navigation_tasks/*.yaml的allow_reverse独立配置。
  allow_reversing: true
  rotate_to_heading_min_angle: 0.785
  stateful: true
  # 启动时三个RPP实例统一使用MatchedRPP；motion_*边界自动派生，不在此重复填写。
  # 改公共速度/加速度后重启；会话motion-limits.json记录有效值与联动警告。

  # ── 按需调整：速度自适应前视（当前开启，优先于上面的lookahead_dist） ──
  # 前视=速度幅值×lookahead_time，限制在min/max之间；关闭后使用lookahead_dist。
  use_velocity_scaled_lookahead_dist: true
  min_lookahead_dist: 0.15
  max_lookahead_dist: 0.6
  lookahead_time: 1.0
  use_cost_regulated_linear_velocity_scaling: false
  # 独立曲率前视关闭，curvature_lookahead_dist当前不生效。
  use_fixed_curvature_lookahead: false
  curvature_lookahead_dist: 0.25
