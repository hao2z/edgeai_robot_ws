# MPPI独立调参；地图/车身差异见navigation_profiles.yaml，Lattice模式统一使用矩形。
FollowPath:
  plugin: nav2_mppi_controller::MPPIController
  time_steps: 80
  model_dt: 0.05
  batch_size: 1200
  ax_max: 0.4
  ax_min: -0.4
  ay_max: 3.0
  ay_min: -3.0
  az_max: 0.8
  vx_std: 0.05
  vy_std: 0.0
  wz_std: 0.1
  vx_max: 0.2
  vx_min: -0.08
  vy_max: 0.0
  wz_max: 0.65
  iteration_count: 1
  prune_distance: 1.2
  transform_tolerance: 0.2
  temperature: 0.3
  gamma: 0.015
  motion_model: DiffDrive
  visualize: true
  regenerate_noises: true
  TrajectoryVisualizer:
    trajectory_step: 100
    time_step: 5
  AckermannConstraints:
    min_turning_r: 0.2
  critics:
  - ConstraintCritic
  - CostCritic
  - GoalCritic
  - GoalAngleCritic
  - PathAlignCritic
  - PathFollowCritic
  - PathAngleCritic
  - PreferForwardCritic
  ConstraintCritic:
    enabled: true
    cost_power: 1
    cost_weight: 4.0
  GoalCritic:
    enabled: true
    cost_power: 1
    cost_weight: 5.0
    threshold_to_consider: 0.8
  GoalAngleCritic:
    enabled: true
    cost_power: 1
    cost_weight: 3.0
    threshold_to_consider: 0.5
  PreferForwardCritic:
    enabled: true
    cost_power: 1
    cost_weight: 2.0
    threshold_to_consider: 0.5
  CostCritic:
    enabled: true
    cost_power: 1
    cost_weight: 3.81
    near_collision_cost: 253
    critical_cost: 300.0
    consider_footprint: false
    collision_cost: 1000000.0
    near_goal_distance: 0.5
    trajectory_point_step: 1
  PathAlignCritic:
    enabled: true
    cost_power: 1
    cost_weight: 20.0
    max_path_occupancy_ratio: 0.05
    trajectory_point_step: 4
    threshold_to_consider: 0.5
    offset_from_furthest: 20
    use_path_orientations: false
  PathFollowCritic:
    enabled: true
    cost_power: 1
    cost_weight: 8.0
    offset_from_furthest: 5
    threshold_to_consider: 0.8
  PathAngleCritic:
    enabled: true
    cost_power: 1
    cost_weight: 2.0
    offset_from_furthest: 4
    threshold_to_consider: 0.5
    max_angle_to_furthest: 1.0
    mode: 0
  enforce_path_inversion: false
  inversion_xy_tolerance: 0.15
  inversion_yaw_tolerance: 0.25
profiles:
  baseline:
    CostCritic:
      near_goal_distance: 1.0
      trajectory_point_step: 2
    GoalCritic:
      threshold_to_consider: 1.4
    PathAlignCritic:
      cost_weight: 14.0
    PathFollowCritic:
      cost_weight: 5.0
      threshold_to_consider: 1.4
    PreferForwardCritic:
      cost_weight: 5.0
    TrajectoryVisualizer:
      time_step: 3
      trajectory_step: 5
    batch_size: 800
    enforce_path_inversion: null
    inversion_xy_tolerance: null
    inversion_yaw_tolerance: null
    prune_distance: 1.7
    time_steps: 56
    transform_tolerance: 0.1
    vx_std: 0.1
    vy_max: 0.5
    vy_std: 0.2
    wz_std: 0.25
  safe:
    CostCritic:
      near_goal_distance: 1.0
      trajectory_point_step: 2
    GoalCritic:
      threshold_to_consider: 1.4
    PathAlignCritic:
      cost_weight: 14.0
    PathFollowCritic:
      cost_weight: 5.0
      threshold_to_consider: 1.4
    PreferForwardCritic:
      cost_weight: 5.0
    TrajectoryVisualizer:
      time_step: 3
      trajectory_step: 5
    batch_size: 800
    enforce_path_inversion: null
    inversion_xy_tolerance: null
    inversion_yaw_tolerance: null
    prune_distance: 1.7
    time_steps: 56
    transform_tolerance: 0.1
    vx_std: 0.1
    vy_max: 0.5
    vy_std: 0.2
    wz_std: 0.25
