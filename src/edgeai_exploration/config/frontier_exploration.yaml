# Adapted from frontier_exploration_ros2 1.6.1 (Apache-2.0).
frontier_explorer:
  ros__parameters:
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    navigate_to_pose_action_name: /exploration/navigate_to_pose
    global_frame: map
    robot_base_frame: base_footprint
    frontier_marker_topic: /explore/frontiers
    selected_frontier_topic: /explore/selected_frontier
    optimized_map_topic: /explore/optimized_map
    completion_event_topic: exploration_complete
    frontier_marker_scale: 0.15
    map_qos_durability: transient_local
    map_qos_reliability: reliable
    map_qos_depth: 1
    map_qos_autodetect_on_startup: false
    map_qos_autodetect_timeout_s: 5.0
    costmap_qos_reliability: reliable
    costmap_qos_depth: 10
    local_costmap_qos_reliability: inherit
    local_costmap_qos_depth: -1
    # 地图处理与前沿评估频率，Hz；并非每次评估都会发新目标。
    map_processing_rate_hz: 2.0
    autostart: true
    control_service_enabled: true
    completion_event_enabled: true
    escape_enabled: true
    return_to_start_on_complete: false
    mrtsp_solver: dp
    dp_solver_candidate_limit: 12
    dp_planning_horizon: 8
    frontier_map_optimization_enabled: true
    # 是否允许有更合适前沿时替换正在执行的目标。
    goal_preemption_enabled: true
    # 两次抢占之间的最短间隔，仿真秒；过短可能打断导航和恢复。
    goal_preemption_min_interval_s: 3.0
    goal_skip_on_blocked_goal: false
    post_goal_settle_enabled: true
    # 到达后的地图稳定等待时间，仿真秒。
    post_goal_min_settle: 1.0
    # 失败前沿的临时抑制开关；导航成功不等于前沿消失。
    frontier_suppression_enabled: true
    # 所有候选被抑制时的策略；stay 表示原地等待，不代表探索完成。
    all_frontiers_suppressed_behavior: stay
    weight_distance_wd: 1.0
    weight_gain_ws: 1.0
    max_linear_speed_vmax: 0.2
    max_angular_speed_wmax: 0.9
    sensor_effective_range_m: 1.5
    frontier_selection_min_distance: 0.6
    frontier_visit_tolerance: 0.4
    # 候选目标到机器人的最小距离，米。
    frontier_candidate_min_goal_distance_m: 1.0
    occ_threshold: 65
    # 前沿最小栅格数量；随地图分辨率变化，过小易追逐细小残留前沿。
    min_frontier_size_cells: 5
    sigma_s: 2.0
    sigma_r: 30.0
    dilation_kernel_radius_cells: 1
    goal_preemption_complete_if_within_m: 0.0
    goal_preemption_lidar_range_m: 12.0
    goal_preemption_lidar_fov_deg: 360.0
    goal_preemption_lidar_ray_step_deg: 1.0
    goal_preemption_lidar_min_reveal_length_m: 0.5
    goal_preemption_lidar_yaw_offset_deg: 0.0
    # 触发抑制的失败次数阈值；越小越早屏蔽失败区域。
    frontier_suppression_attempt_threshold: 2
    # 初始抑制区域尺寸，米；过大会连带屏蔽附近其他前沿。
    frontier_suppression_base_size_m: 0.3
    # 重复失败时抑制区域的扩大量，米。
    frontier_suppression_expansion_size_m: 0.1
    # 抑制冷却时间，仿真秒；过短容易反复选择不可达目标。
    frontier_suppression_timeout_s: 30.0
    # 探索器外层无进展超时，秒；0 禁用，避免抢先打断 Nav2 恢复。
    frontier_suppression_no_progress_timeout_s: 10.0
    frontier_suppression_progress_epsilon_m: 0.1
    frontier_suppression_startup_grace_period_s: 15.0
    frontier_suppression_max_attempt_records: 256
    frontier_suppression_max_regions: 64
    use_sim_time: true
