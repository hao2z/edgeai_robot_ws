suspect_targets:
  ros__parameters:
    use_sim_time: true
    processing_hz: 5.0  # 仿真时间Hz；提高短暂入镜时的采样与多帧确认机会。
    enabled: true  # 独立持续感知，不受探索暂停、转圈或任务阶段影响。
    depth_geometry_enabled: true  # 深度突变分割提供不依赖白色外观的候选。
    laser_enabled: true  # 激光命中加分；未命中不否定，扫描面可能低于目标。
    laser_topic: /scan
    laser_sync_slop_s: 0.15
    laser_support_radius_m: 0.10
    max_candidates: 24
    fusion_window: 20
    panel_size_m: 0.20
    max_image_age_s: 0.5
    sync_slop_s: 0.05
    confirmation_frames: 2
    candidate_ttl_s: 8.0  # 单帧候选过期时间；多帧候选保留至本次会话结束。
    known_target_radius_m: 0.30
    output_directory: ''
