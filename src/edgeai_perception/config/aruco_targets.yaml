aruco_targets:
  ros__parameters:
    use_sim_time: true
    image_topic: /camera/image
    camera_info_topic: /camera/camera_info
    optical_frame: camera_optical_frame
    map_anchoring: slam_graph  # 每帧绑定SLAM关键帧；历史目标随对应图节点修正。
    anchor_max_distance_m: 3.0  # 在map中按空间最近关键帧绑定，不限制关键帧年龄。
    anchor_processing_hz: 5.0  # 后台关联；找不到节点时仍发布图像时刻的map定位。
    target_publish_hz: 5.0  # map目标位置及RViz更新频率；相机检测频率单独设置。
    # Development fixtures only; no target truth coordinates are loaded.
    dictionary: DICT_4X4_50
    marker_size_m: 0.20  # black marker edge, NOT the 0.24 m white panel
    processing_hz: 30.0  # 与30Hz相机对齐，提高短暂入镜采样；只处理最新帧，不积压图像。
    # 白面板外缘与黑色标记边框相邻，0.05 会抑制正确候选；真实漏检帧对比后取0.02。
    min_marker_distance_rate: 0.02
    max_image_age_s: 0.5
    min_marker_side_px: 6.0  # 远距/斜视允许更小标记；仍检查PnP误差和多帧一致性。
    max_reprojection_error_px: 2.5
    min_distance_m: 0.15
    max_distance_m: 5.0
    confirmation_observations: 3
    fusion_window_s: 20.0
    reobservation_window_s: 1.0  # 新位置偏离历史时，在此时间内以confirmation_observations条一致观测重新定位。
    max_observations_per_id: 20
    outlier_distance_m: 0.30
    stale_after_s: 10.0
    output_directory: ''  # runner sets the current session directory
    # Development mapping only; replace with the competition's official ID/type table.
    target_types: '1:normal,2:normal,3:normal,10:cooperative'
